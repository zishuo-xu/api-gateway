services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 故意不写 ports：redis 只在 compose 网络内可达，宿主机与公网都摸不到。
    # 内存兜底：网关缓存的是整个 GET 响应体，现在总量虽小（~1.5M），
    # 但接一个缓存多的 GET API 就会涨；给个上限让 LRU 淘汰，而不是 OOM。
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: gateway
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # PG 镜像只在数据目录为空的首次启动执行它；migrate.sql 只做 ALTER，
      # 基础建表靠这里，所以全新部署必须挂上。
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # 同上，不暴露端口。本地调试才需要 5432，生产一切走容器网络。

  gateway:
    build:
      # compose 文件在 deploy/ 下，构建上下文指回项目根。
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      PG_DSN: postgres://gateway:${PG_PASSWORD}@postgres:5432/gateway?sslmode=disable
      GATEWAY_ADDR: ":8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DEMO_API_KEY: ${DEMO_API_KEY}
      UPSTREAM_TIMEOUT_SEC: "180"
      MAX_ATTEMPTS: "3"
      AUTO_MIGRATE: "true"
      UNIFIED_PREFIX: "/v1"
      QUOTA_FLUSH_SEC: "10"
      INJECT_STREAM_USAGE: "true"
      # 出口代理页。走容器内网调 mihomo 的控制 API，9090 只映射了回环地址，
      # 公网与容器外都够不着。留空则控制台自动隐藏该页签。
      MIHOMO_API: http://mihomo:9090
      # 必须是 select 组：url-test 组会周期重选最快节点，手动切换活不过一个周期。
      MIHOMO_GROUP: PROXY
      MIHOMO_AUTO_GROUP: AUTO
    depends_on:
      - redis
      - postgres
    # grok-net 必须显式声明。靠手工 `docker network connect` 加上去的连接，
    # 在 compose 重建容器时会丢失——重建出来的是新容器，只会连本文件里声明的
    # 网络。结果就是容器内解析不到 progrok，Grok 通道直接 502。
    networks:
      - default
      - grok-net
    # 刻意不 depends_on progrok：Grok 通道挂掉不应该拖垮 gateway 自己，
    # DeepSeek 等其它通道还得能用。通道级故障由网关的熔断器兜底。

  mihomo:
    image: metacubex/mihomo
    # 必须锁死名字：progrok 的环境变量写死的是 HTTP_PROXY=http://mihomo:7890，
    # 按容器名解析。compose 默认生成的 deploy-mihomo-1 会让这个地址解析不到，
    # progrok 直接断网。同理 gateway 侧也无条件依赖这个名字。
    container_name: mihomo
    restart: unless-stopped
    volumes:
      # 配置在宿主机固定位置，不随代码仓库走（里面有订阅 URL，不进 git）。
      - /opt/mihomo:/root/.config/mihomo
    ports:
      # 控制 API。只映射回环地址，公网与容器外都摸不到。
      # gw-proxy-guard 自愈脚本靠它清 DNS 缓存，比重启容器温和——不中断现有连接。
      - "127.0.0.1:9090:9090"
    networks:
      - grok-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:9090/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  progrok:
    image: node:22-alpine
    # 同理锁死：网关里 Grok 渠道的上游地址写的是 http://progrok:18645。
    container_name: progrok
    restart: unless-stopped
    # progrok 没有官方固定版本镜像，只能每次启动现装 CLI。
    # 副作用是个启动期循环依赖：npm 装包走 HTTP_PROXY=mihomo，
    # 所以 mihomo 没就绪时 progrok 必然启动失败——由 restart 策略负责重试到成功。
    command: sh -c "npm i -g progrok >/dev/null 2>&1 && progrok proxy --host 0.0.0.0"
    environment:
      HTTP_PROXY: http://mihomo:7890
      HTTPS_PROXY: http://mihomo:7890
      NO_PROXY: 127.0.0.1,localhost
      NODE_OPTIONS: --use-env-proxy
    volumes:
      # 卷里存着 SuperGrok 的 OAuth token（device-code 登录一次换来的）。
      # 必须 external:true —— 否则 compose 会新建 "deploy_progrok-data" 空卷，
      # token 看起来丢了，得重新走一遍 device-code 登录。
      - progrok-data:/root
    networks:
      - grok-net
    depends_on:
      - mihomo

# grok-net 由本文件的 mihomo / progrok 与 gateway 共用。
# 前置条件：该网络必须已存在（见 docs/deployment.md 第 3 节）。
networks:
  grok-net:
    external: true
    name: grok-net

volumes:
  # 同 grok-net：卷是手工 docker run 时建的，本文件只接管不重建。
  progrok-data:
    external: true
    name: progrok-data
